name: Render health ping (best effort)
on:
  schedule:
    - cron: '*/13 * * * *'
  workflow_dispatch:
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Check health endpoint
        env:
          HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL" || { echo 'Set RENDER_HEALTH_URL secret'; exit 1; }
          curl --fail --silent --show-error --max-time 90 --retry 2 "$HEALTH_URL"