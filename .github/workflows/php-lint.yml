name: PHP and frontend syntax
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: gangchil_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: gangchil_ci
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
      - name: Syntax check
        run: |
          for f in private/*.php public/*.php; do php -l "$f"; done
          node --check public/app.js
          node tests/frontend-smoke.cjs
          php tests/phone.php
          php tests/phone-db.php
