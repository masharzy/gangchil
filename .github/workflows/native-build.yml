name: Native application builds
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['native/**', '.github/workflows/native-build.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native Android app with FCM
        working-directory: native/android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: gangchil-android-unsigned
          path: native/android/build/outputs/apk/release/*-unsigned.apk
          retention-days: 7
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: native/windows/package-lock.json
      - name: Install NSIS
        run: choco install nsis --no-progress --yes
      - name: Package Windows application
        working-directory: native/windows
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & 'C:\Program Files (x86)\NSIS\makensis.exe' installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: gangchil-windows-installer-unsigned
          path: native/windows/dist/Gangchil-Setup.exe
          retention-days: 7
