plugins { id 'com.android.application' version '8.7.3' }
android {
 namespace 'com.gangchil.counter'
 compileSdk 35
 defaultConfig { applicationId 'com.gangchil.counter'; minSdk 26; targetSdk 35; versionCode 7; versionName '1.2.3' }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs=['src']; res.srcDirs=['res']; assets.srcDirs=['assets'] } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

dependencies { implementation 'com.google.firebase:firebase-messaging:24.1.0' }
